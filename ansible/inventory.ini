# Inventaire VOC — machines Linux du réseau
[voc_linux]
tbini ansible_host=192.168.184.138 ansible_user=tbini

[voc_linux:vars]
ansible_ssh_private_key_file=/root/.ssh/id_ed25519_voc
ansible_python_interpreter=/usr/bin/python3
# tbini a été ajouté aux sudoers NOPASSWD (via su, une seule fois)
ansible_become=yes
ansible_become_method=sudo

# Exemple pour ajouter une nouvelle machine plus tard :
# [voc_linux]
# pc2 ansible_host=192.168.184.140 ansible_user=admin
