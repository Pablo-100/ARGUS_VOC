input {
  http {
    port => 5044
    additional_codecs => { "application/json" => "json" }
  }
}

filter {
  mutate {
    add_field => { "voc_platform" => "true" }
  }

  if [risk_score] {
    mutate { convert => { "risk_score" => "float" } }
  }
  if [cvss] {
    mutate { convert => { "cvss" => "float" } }
  }
  if [epss_score] {
    mutate { convert => { "epss_score" => "float" } }
  }
  if [epss_percentile] {
    mutate { convert => { "epss_percentile" => "float" } }
  }
  if [severity] and [severity] =~ /^[0-9.]+$/ {
    mutate { convert => { "severity" => "float" } }
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  if [source] == "openvas" {
    mutate {
      add_field => { "index_name" => "openvas" }
    }
  } else if [source] == "glpi" {
    mutate {
      add_field => { "index_name" => "glpi" }
    }
  } else if [source] == "voc_prediction" {
    mutate {
      add_field => { "index_name" => "predictions" }
    }
  } else if [source] == "voc_validation" {
    mutate {
      add_field => { "index_name" => "prediction-validation" }
    }
  } else if [source] == "voc_graph" {
    mutate {
      add_field => { "index_name" => "attack-graph" }
    }
  } else {
    mutate {
      add_field => { "index_name" => "vulnerabilities" }
    }
  }
}

output {
  if [source] == "openvas" {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "openvas-%{+YYYY.MM.dd}"
    }
  } else if [source] == "glpi" {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "glpi-%{+YYYY.MM.dd}"
    }
  } else if [source] == "voc_prediction" {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "predictions-%{+YYYY.MM.dd}"
    }
  } else if [source] == "voc_validation" {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "prediction-validation-%{+YYYY.MM.dd}"
    }
  } else if [source] == "voc_graph" {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "attack-graph-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD}"
      index => "vulnerabilities-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }
}
